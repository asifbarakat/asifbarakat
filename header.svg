<svg fill="none" viewBox="0 0 900 170" width="900" height="170" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vu-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="p95-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="edge-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; }
    .name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 30px; font-weight: 800; fill: #f0f6fc; letter-spacing: -0.5px; }
    .role { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; fill: #8b949e; }
    .org { fill: #e6edf3; font-weight: 600; }
    .sep { fill: #38bdf8; font-weight: 700; }

    .axis-label { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 9.5px; }
    .grid-h { stroke: #161b22; stroke-width: 1px; }
    .thresh-line { stroke-width: 1px; stroke-dasharray: 3 3; opacity: 0.55; }
    .badge-text { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; font-weight: 600; }

    /* ================================================================= */
    /* SCENE 1 TIMING: 0s to 12s (0% to 60% of 20s Master Cycle)         */
    /* Matches Typing Lines 1, 2, 3 (3 lines x 4s = 12s)                 */
    /* ================================================================= */
    .s1-curve {
      fill: none; stroke-linecap: round; stroke-dasharray: 100;
      animation: draw-s1 20s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }
    .s1-area { animation: area-s1 20s ease infinite; }
    .s1-badge { animation: badge-s1 20s ease infinite; }

    @keyframes draw-s1 {
      0%, 2%     { stroke-dashoffset: 100; opacity: 0; }
      4%         { opacity: 1; }
      18%, 55%   { stroke-dashoffset: 0; opacity: 1; }
      59%, 100%  { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes area-s1 {
      0%, 6%     { opacity: 0; }
      18%, 55%   { opacity: 1; }
      59%, 100%  { opacity: 0; }
    }
    @keyframes badge-s1 {
      0%, 14%    { opacity: 0; transform: translateY(2px); }
      18%, 55%   { opacity: 1; transform: translateY(0); }
      59%, 100%  { opacity: 0; }
    }

    /* ================================================================= */
    /* SCENE 2 TIMING: 12s to 20s (60% to 100% of 20s Master Cycle)      */
    /* Matches Typing Lines 4, 5 (2 lines x 4s = 8s)                     */
    /* ================================================================= */
    .s2-curve {
      fill: none; stroke-linecap: round; stroke-dasharray: 100;
      animation: draw-s2 20s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }
    .s2-area { animation: area-s2 20s ease infinite; }
    .s2-badge { animation: badge-s2 20s ease infinite; }

    @keyframes draw-s2 {
      0%, 60%    { stroke-dashoffset: 100; opacity: 0; }
      62%        { opacity: 1; }
      74%, 95%   { stroke-dashoffset: 0; opacity: 1; }
      99%, 100%  { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes area-s2 {
      0%, 64%    { opacity: 0; }
      74%, 95%   { opacity: 1; }
      99%, 100%  { opacity: 0; }
    }
    @keyframes badge-s2 {
      0%, 70%    { opacity: 0; transform: translateY(2px); }
      74%, 95%   { opacity: 1; transform: translateY(0); }
      99%, 100%  { opacity: 0; }
    }
  </style>

  <!-- Outer Card -->
  <rect x="0.5" y="0.5" width="899" height="169" rx="12" ry="12" class="bg" />

  <!-- Left Identity (Untouched 2-Line Layout) -->
  <text x="48" y="82" class="name">Asif Barakat Chowdhury</text>
  <text x="48" y="116" class="role">
    SQA Engineer Intern @ <tspan class="org">AppifyLab</tspan> <tspan class="sep"> // </tspan> CSE Graduate @ <tspan class="org">Leading University</tspan>
  </text>

  <!-- Right Telemetry Chart Slot -->
  <g transform="translate(615, 0)">
    <!-- Shared Minimal Grid Lines -->
    <line x1="20" y1="75" x2="245" y2="75" class="grid-h" />
    <line x1="20" y1="108" x2="245" y2="108" class="grid-h" />
    <line x1="20" y1="138" x2="245" y2="138" stroke="#21262d" stroke-width="1" />

    <!-- =============================================================== -->
    <!-- SCENE 1 (0s - 12s): SQA, GRAFANA K6 & POSTMAN TELEMETRY         -->
    <!-- =============================================================== -->
    <line x1="20" y1="42" x2="245" y2="42" stroke="#f85149" class="thresh-line s1-area" />
    <text x="245" y="37" text-anchor="end" class="axis-label s1-area" fill="#f85149">SLA 100ms</text>

    <path d="M 20 138 L 55 130 L 95 82 L 185 82 L 220 125 L 245 135 L 245 138 Z" fill="url(#vu-fill)" class="s1-area" />
    <path d="M 20 138 L 55 122 L 95 96 L 140 62 L 185 68 L 245 92 L 245 138 Z" fill="url(#p95-fill)" class="s1-area" />

    <path d="M 20 136 L 55 130 L 95 82 L 185 82 L 220 125 L 245 135" pathLength="100" stroke="#a371f7" stroke-width="2" class="s1-curve" />
    <path d="M 20 132 L 55 122 L 95 96 L 140 62 L 185 68 L 245 92" pathLength="100" stroke="#38bdf8" stroke-width="2.2" class="s1-curve" />

    <text x="20" y="154" class="badge-text s1-badge" fill="#a371f7">500 VUs</text>
    <text x="82" y="154" class="badge-text s1-badge" fill="#38bdf8">P95: 68ms</text>
    <text x="245" y="154" text-anchor="end" class="badge-text s1-badge" fill="#3fb950">0.00% ERR</text>

    <!-- =============================================================== -->
    <!-- SCENE 2 (12s - 20s): EDGE LLM SPLIT COMPUTING & MOBILE MESH     -->
    <!-- =============================================================== -->
    <line x1="20" y1="42" x2="245" y2="42" stroke="#3fb950" class="thresh-line s2-area" />
    <text x="245" y="37" text-anchor="end" class="axis-label s2-area" fill="#3fb950">SPLIT HANDOFF</text>

    <!-- Edge Feature Compression Fill & RPC Handoff Fill -->
    <path d="M 20 138 L 60 115 L 95 72 L 132 72 L 170 105 L 210 64 L 245 58 L 245 138 Z" fill="url(#edge-fill)" class="s2-area" />
    <path d="M 20 138 L 60 124 L 95 110 L 132 72 L 170 68 L 210 84 L 245 76 L 245 138 Z" fill="url(#p95-fill)" class="s2-area" />

    <!-- Edge RPi 5 Feature Extraction Curve (Green) -->
    <path d="M 20 134 L 60 115 L 95 72 L 132 72 L 170 105 L 210 64 L 245 58" pathLength="100" stroke="#3fb950" stroke-width="2.2" class="s2-curve" />
    <!-- RPC Split Stream & Mobile Mesh Curve (Cyan) -->
    <path d="M 20 136 L 60 124 L 95 110 L 132 72 L 170 68 L 210 84 L 245 76" pathLength="100" stroke="#38bdf8" stroke-width="2" class="s2-curve" />

    <!-- Split Handoff & Mesh Nodes -->
    <circle cx="95" cy="72" r="3.5" fill="#0d1117" stroke="#3fb950" stroke-width="2" class="s2-badge" />
    <circle cx="132" cy="72" r="4" fill="#0d1117" stroke="#38bdf8" stroke-width="2" class="s2-badge" />
    <circle cx="210" cy="64" r="3.5" fill="#0d1117" stroke="#a371f7" stroke-width="2" class="s2-badge" />

    <text x="20" y="154" class="badge-text s2-badge" fill="#3fb950">RPi5 EDGE</text>
    <text x="90" y="154" class="badge-text s2-badge" fill="#38bdf8">0-PARAM</text>
    <text x="245" y="154" text-anchor="end" class="badge-text s2-badge" fill="#a371f7">RPC: 14ms</text>
  </g>
</svg>
