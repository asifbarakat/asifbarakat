<svg fill="none" viewBox="0 0 900 170" width="900" height="170" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vu-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="p95-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; }
    .name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 30px; font-weight: 800; fill: #f0f6fc; letter-spacing: -0.5px; }
    .role { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; fill: #8b949e; }
    .org { fill: #e6edf3; font-weight: 600; }
    .sep { fill: #38bdf8; font-weight: 700; }

    .axis-label { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 9.5px; fill: #484f58; }
    .grid-h { stroke: #161b22; stroke-width: 1px; }
    .sla-line { stroke: #f85149; stroke-width: 1px; stroke-dasharray: 3 3; opacity: 0.55; }

    .vu-curve {
      stroke: #a371f7; stroke-width: 2; fill: none; stroke-linecap: round;
      stroke-dasharray: 100;
      animation: draw-curve 10s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }
    .p95-curve {
      stroke: #38bdf8; stroke-width: 2.2; fill: none; stroke-linecap: round;
      stroke-dasharray: 100;
      animation: draw-curve 10s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }
    .area-fade {
      animation: show-area 10s ease infinite;
    }
    .badge-fade {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 10px; font-weight: 600;
      animation: show-badge 10s ease infinite;
    }

    @keyframes draw-curve {
      0%, 5%   { stroke-dashoffset: 100; opacity: 0; }
      8%       { opacity: 1; }
      48%, 88% { stroke-dashoffset: 0; opacity: 1; }
      95%, 100%{ stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes show-area {
      0%, 15%  { opacity: 0; }
      48%, 88% { opacity: 1; }
      95%, 100%{ opacity: 0; }
    }
    @keyframes show-badge {
      0%, 44%  { opacity: 0; transform: translateY(2px); }
      50%, 88% { opacity: 1; transform: translateY(0); }
      95%, 100%{ opacity: 0; }
    }
  </style>

  <rect x="0.5" y="0.5" width="899" height="169" rx="12" ry="12" class="bg" />

  <text x="48" y="82" class="name">Asif Barakat Chowdhury</text>
  <text x="48" y="116" class="role">
    SQA Engineer Intern @ <tspan class="org">AppifyLab</tspan> <tspan class="sep"> // </tspan> CSE Graduate @ <tspan class="org">Leading University</tspan>
  </text>

  <!-- Right Telemetry Chart -->
  <g transform="translate(615, 0)">
    <!-- Horizontal Grid & SLA Threshold -->
    <line x1="20" y1="42" x2="245" y2="42" class="sla-line" />
    <text x="245" y="37" text-anchor="end" class="axis-label" fill="#f85149" opacity="0.7">SLA 100ms</text>

    <line x1="20" y1="75" x2="245" y2="75" class="grid-h" />
    <line x1="20" y1="108" x2="245" y2="108" class="grid-h" />
    <line x1="20" y1="138" x2="245" y2="138" stroke="#21262d" stroke-width="1" />

    <!-- Shaded Areas -->
    <path d="M 20 138 L 55 130 L 95 82 L 185 82 L 220 125 L 245 135 L 245 138 Z" fill="url(#vu-fill)" class="area-fade" />
    <path d="M 20 138 L 55 122 L 95 96 L 140 62 L 185 68 L 245 92 L 245 138 Z" fill="url(#p95-fill)" class="area-fade" />

    <!-- Virtual Users Ramp (Purple) -->
    <path d="M 20 136 L 55 130 L 95 82 L 185 82 L 220 125 L 245 135" pathLength="100" class="vu-curve" />

    <!-- P95 Latency Curve (Cyan) -->
    <path d="M 20 132 L 55 122 L 95 96 L 140 62 L 185 68 L 245 92" pathLength="100" class="p95-curve" />

    <!-- Readout Footer -->
    <text x="20" y="154" class="badge-fade" fill="#a371f7">500 VUs</text>
    <text x="82" y="154" class="badge-fade" fill="#38bdf8">P95: 68ms</text>
    <text x="245" y="154" text-anchor="end" class="badge-fade" fill="#3fb950">0.00% ERR</text>
  </g>
</svg>
